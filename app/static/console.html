<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company OS — Console</title>
<style>
  :root{
    --bg:#f4efe4; --surface:#fffdf7; --surface2:#f3eee2; --border:#e4dccb; --border2:#d8cdb8;
    --text:#232019; --muted:#6d685b; --faint:#9c9384;
    --accent:#1f3a5f; --accent-d:#16293f; --green:#3f7d54; --amber:#a87d2c; --red:#a23b3b; --purple:#6b5b95;
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --r:8px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}

  /* layout */
  #app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em;padding:4px 8px 20px;color:var(--text)}
  .brand .dot{width:30px;height:30px;border-radius:6px;background:var(--accent);color:#f4efe4;display:grid;place-items:center;font-size:15px;font-family:var(--serif)}
  nav{display:flex;flex-direction:column;gap:2px}
  nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:6px;color:var(--muted);font-weight:500;cursor:pointer}
  nav a svg{width:17px;height:17px;opacity:.8}
  nav a:hover{background:var(--surface2);color:var(--text)}
  nav a.active{background:rgba(31,58,95,.09);color:var(--accent);font-weight:600}
  nav a.active svg{opacity:1}
  .side-foot{margin-top:auto;font-size:12px;color:var(--faint)}
  .conn{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;margin-top:10px}
  .conn .led{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .conn.ok .led{background:var(--green)}

  main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:baseline;gap:14px;padding:20px 32px;background:rgba(244,239,228,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .topbar h1{margin:0;font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.005em}
  .topbar .sub{color:var(--faint);font-size:13px;font-style:italic}
  .spacer{flex:1}
  .content{padding:28px 32px;max-width:1080px;width:100%}

  /* primitives */
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:0 1px 2px rgba(70,55,25,.04)}
  .panel h2{margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:10px}
  .panel .h-row{display:flex;align-items:center;margin:-2px 0 16px}
  .panel .h-row h2{margin:0;border:none;padding:0}

  .stat{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:15px 16px;position:relative;overflow:hidden}
  .stat .lbl{font-size:12px;color:var(--muted)}
  .stat .val{font-family:var(--serif);font-size:27px;font-weight:600;margin-top:4px;letter-spacing:-.01em;color:var(--text)}
  .stat .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .stat.warn .bar{background:var(--amber)} .stat.bad .bar{background:var(--red)} .stat.good .bar{background:var(--green)}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border2);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:6px;font:inherit;font-weight:550;cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#f4efe4}
  .btn-primary:hover{background:var(--accent-d);color:#fff}
  .btn-danger{background:transparent;border-color:#c9a3a3;color:var(--red)}
  .btn-danger:hover{background:#f6ecec;border-color:var(--red)}
  .btn-sm{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:9px 12px;width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:11px 10px;border-bottom:1px solid var(--border)}
  tr.clik{cursor:pointer} tr.clik:hover td{background:var(--surface2)}
  tr:last-child td{border-bottom:none}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface2);border:1px solid var(--border2);color:var(--muted)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-done,.b-ok,.b-qualified,.b-approved{color:var(--green)}
  .b-active,.b-running,.b-reviewed{color:var(--accent)}
  .b-planning,.b-scheduled,.b-proposed,.b-pending{color:var(--amber)}
  .b-slip,.b-blocked,.b-disqualified,.b-failed{color:var(--red)}
  .b-human,.b-insufficient_info,.b-at_risk{color:var(--purple)}
  .chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);margin:0 5px 5px 0}
  .star{color:var(--amber)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .empty{color:var(--faint);padding:18px;text-align:center}
  pre.art{white-space:pre-wrap;background:#fbf8f1;border:1px solid var(--border);border-radius:6px;padding:13px 15px;margin:8px 0 0;max-height:300px;overflow:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#33302a}
  .art-card{border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
  .art-card .ah{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .back{color:var(--accent);cursor:pointer;font-weight:600;font-size:13px}
  .kv{display:flex;gap:22px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .kv b{color:var(--text);font-weight:600}

  .chatmsg{display:flex;gap:11px;margin:0 0 14px;align-items:flex-start}
  .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:14px;background:var(--accent);color:#f4efe4}
  .bubble{background:var(--surface2);border:1px solid var(--border);border-radius:3px 10px 10px 10px;padding:10px 14px;max-width:82%}
  .bubble .who{font-size:12.5px;font-weight:700;color:var(--accent)}
  .bubble .txt{margin-top:3px;color:var(--text)}

  #toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:50}
  .toast{background:var(--surface);border:1px solid var(--border2);border-left:3px solid var(--accent);border-radius:6px;padding:11px 15px;min-width:230px;box-shadow:0 8px 30px rgba(70,55,25,.14);animation:in .2s}
  .toast.err{border-left-color:var(--red)} .toast.ok{border-left-color:var(--green)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}

  /* auth gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}
  #gate .box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:34px;width:min(440px,92vw);box-shadow:0 10px 40px rgba(70,55,25,.10)}
  #gate h2{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:26px} #gate p{color:var(--muted);margin:0 0 18px}

  @media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px}.side-foot{display:none}nav{flex-direction:row;flex-wrap:wrap}.content{padding:16px}}
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h2>Company OS</h2>
    <p>Paste an access token to connect. Get one with <code>POST /orgs</code> or <code>POST /login</code>.</p>
    <label>Access token</label>
    <input id="gate-tok" placeholder="eyJhbGci...">
    <div class="row" style="margin-top:14px"><button class="btn btn-primary" onclick="connect()">Connect</button>
      <span class="faint">or open <a class="back" href="/docs" target="_blank">/docs</a></span></div>
    <div id="gate-err" class="faint" style="margin-top:10px;color:var(--red)"></div>
  </div>
</div>

<div id="app" style="display:none">
  <aside>
    <div class="brand"><span class="dot">◆</span> Company OS</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="conn" id="conn"><span class="led"></span><span id="conn-txt">disconnected</span></div>
      <div class="row" style="margin-top:8px"><span class="back" onclick="logout()">Change token</span></div>
    </div>
  </aside>
  <main>
    <div class="topbar"><h1 id="pg-title">Dashboard</h1><span class="sub" id="pg-sub"></span>
      <span class="spacer"></span><button class="btn btn-sm" onclick="render()">↻ Refresh</button></div>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="toasts"></div>

<script>
const cleanTok = (t) => (t || '').replace(/[^A-Za-z0-9._-]/g, '');  // strip stray spaces/newlines from pastes
const S = { tok: cleanTok(localStorage.getItem('cos_tok')), depts: {} };
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s) => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H = () => ({authorization:'Bearer '+S.tok,'content-type':'application/json'});
const badge = (s) => `<span class="badge b-${esc(s)}">${esc(s)}</span>`;
const dept = (id) => S.depts[id] || '—';
function toast(msg, kind){ const t=$(`<div class="toast ${kind||''}">${esc(msg)}</div>`); document.getElementById('toasts').append(t); setTimeout(()=>t.remove(),3800); }

async function api(method, path, body){
  const r = await fetch(path, {method, headers:H(), body: body?JSON.stringify(body):undefined});
  if(r.status===401){ toast('Session expired — reconnect','err'); logout(); throw {status:401}; }
  if(!r.ok){ let d; try{d=JSON.stringify((await r.json()).detail)}catch{d=await r.text()} throw {status:r.status, detail:d}; }
  const ct=r.headers.get('content-type')||''; return ct.includes('json')? r.json() : r.text();
}

const NAV = [
  ['dashboard','Dashboard','M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 14h7v7H3z'],
  ['projects','Projects','M3 4h18v4H3zM3 10h18v10H3z'],
  ['agents','Agents','M9 11a3 3 0 100-6 3 3 0 000 6zM3 20v-1a4 4 0 014-4h4a4 4 0 014 4v1M16 11a3 3 0 10-1-6M21 20v-1a4 4 0 00-3-3.8'],
  ['activity','Activity','M3 12h4l2.5 7 4-15L16 12h5'],
  ['leads','Leads / CRM','M12 12a4 4 0 100-8 4 4 0 000 8zM4 20a8 8 0 0116 0z'],
  ['controls','Governance','M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z'],
];
const pct = (x) => Math.round((x||0)*100)+'%';
const scTile = (l,v) => `<div class="stat"><span class="bar"></span><div class="lbl">${l}</div><div class="val" style="font-size:19px">${v}</div></div>`;
function drawNav(){
  document.getElementById('nav').innerHTML = NAV.map(([k,l,p])=>
    `<a data-k="${k}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${p}"/></svg>${l}</a>`).join('');
}
function go(k){ location.hash = '#/'+k; }

// ---------- views ----------
const V = {};

V.dashboard = async () => {
  setTitle('Dashboard','company at a glance');
  const s = await api('GET','/console/standup');
  const el = document.getElementById('view');
  el.innerHTML = '';
  el.append($(`<div class="panel"><h2>Directive</h2>
    <div class="row"><input id="goal" placeholder="State a goal — the Lead will decompose it into a plan" style="flex:1">
    <button class="btn btn-primary" onclick="directive()">Plan it</button></div>
    <div class="faint" id="dmsg" style="margin-top:9px"></div></div>`));

  const tiles = [
    ['Projects done', s.shipped.projects_done+'/'+s.shipped.projects_total,'good'],
    ['Tasks done', s.shipped.tasks_done,''],
    ['Slipping', s.at_risk.projects_slipping, s.at_risk.projects_slipping?'bad':''],
    ['At risk', s.at_risk.tasks_at_risk, s.at_risk.tasks_at_risk?'warn':''],
    ['Pending approvals', s.needs_you.pending_approvals, s.needs_you.pending_approvals?'warn':''],
    ['Needs human', s.needs_you.artifacts_need_human, s.needs_you.artifacts_need_human?'warn':''],
    ['Blocked (legal)', s.needs_you.artifacts_blocked_by_legal, s.needs_you.artifacts_blocked_by_legal?'bad':''],
    ['Spent', '$'+s.cost.spent_usd, ''],
  ];
  el.append($(`<div class="panel"><h2>Standup digest</h2>
    <div class="grid cards">${tiles.map(([l,v,c])=>`<div class="stat ${c}"><span class="bar"></span><div class="lbl">${l}</div><div class="val">${v}</div></div>`).join('')}</div></div>`));

  const appr = await api('GET','/approvals').catch(()=>[]);
  el.append($(`<div class="panel"><div class="h-row"><h2>Decision queue</h2><span class="spacer"></span><span class="back" onclick="go('controls')">controls →</span></div>
    <div id="appr">${renderApprovals(appr)}</div></div>`));

  const projs = (await api('GET','/projects').catch(()=>[])).slice(0,5);
  el.append($(`<div class="panel"><div class="h-row"><h2>Recent projects</h2><span class="spacer"></span><span class="back" onclick="go('projects')">all →</span></div>
    ${projs.length?projectTable(projs):'<div class="empty">No projects yet. State a directive above.</div>'}</div>`));
  bindApprovals();
};

V.projects = async () => {
  setTitle('Projects','the work graph');
  const projs = await api('GET','/projects');
  const el = document.getElementById('view'); el.innerHTML='';
  el.append($(`<div class="panel"><h2>New project</h2><div class="row">
    <input id="goal" placeholder="Goal for a new project" style="flex:1">
    <button class="btn btn-primary" onclick="directive()">Plan it</button></div><div class="faint" id="dmsg" style="margin-top:9px"></div></div>`));
  el.append($(`<div class="panel"><h2>All projects (${projs.length})</h2>${projs.length?projectTable(projs):'<div class="empty">None yet.</div>'}</div>`));
};

V.project = async (id) => {
  setTitle('Project','delivery detail');
  const el = document.getElementById('view'); el.innerHTML = '<div class="faint">Loading…</div>';
  const [p, arts, hos, mem, threads] = await Promise.all([
    api('GET','/projects/'+id),
    api('GET','/projects/'+id+'/artifacts').catch(()=>[]),
    api('GET','/projects/'+id+'/handoffs').catch(()=>[]),
    api('GET','/projects/'+id+'/memory').catch(()=>[]),
    api('GET','/projects/'+id+'/threads').catch(()=>[]),
  ]);
  const chatter = (threads.find(t=>t.thread_type==='status')||{}).messages||[];
  el.innerHTML='';
  el.append($(`<div class="back" onclick="go('projects')">← Projects</div>`));
  const acts = [];
  if(p.status==='planning'){ acts.push(`<button class="btn btn-primary btn-sm" onclick="runProject('${id}')">▶ Run it</button>`);
                             acts.push(`<button class="btn btn-sm" onclick="act('${id}','approve')">Approve only</button>`); }
  if(p.status==='active')   acts.push(`<button class="btn btn-primary btn-sm" onclick="runProject('${id}')">▶ Run</button>`);
  if(p.status==='executing')acts.push(`<span class="badge b-running">● agents working — auto-refreshing</span>`);
  if(p.status==='done')     acts.push(`<span class="badge b-done">✓ done — see Deliverables below</span>`);
  el.append($(`<div class="panel" style="margin-top:12px"><div class="row" style="align-items:flex-start">
      <div style="flex:1"><div style="font-size:17px;font-weight:650">${esc(p.goal)}</div>
        <div class="kv" style="margin-top:8px">${badge(p.status)} ${badge(p.health)}
          <span>due <b>${p.due_at?new Date(p.due_at).toLocaleString():'—'}</b></span>
          <span>critical path <b>${p.critical_path.length}</b> tasks</span></div></div>
      <div class="row">${acts.join('')}</div></div></div>`));

  // tasks
  const rows = p.tasks.map(t=>`<tr>
    <td class="muted">${esc(dept(t.department_id))}</td>
    <td>${t.is_critical?'<span class="star">★</span> ':''}${esc(t.goal)}</td>
    <td>${badge(t.status)}</td>
    <td class="muted">${t.est_effort_hours}h</td>
    <td class="muted">${t.slack_h}h</td>
    <td class="muted">${t.depends_on.length}</td></tr>`).join('');
  el.append($(`<div class="panel"><h2>Tasks (${p.tasks.length})</h2>
    <table><thead><tr><th>Dept</th><th>Task</th><th>Status</th><th>Effort</th><th>Slack</th><th>Deps</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`));

  // team chat — the agents talking through the work, task by task
  el.append($(`<div class="panel"><h2>Team chat (${chatter.length})</h2>
    ${chatter.length?chatter.map(m=>{
        const i=m.content.indexOf(':'); const who=i>0?m.content.slice(0,i):'Agent'; const txt=i>0?m.content.slice(i+1).trim():m.content;
        return `<div class="chatmsg"><div class="avatar">${esc(who.trim()[0]||'A')}</div>
          <div class="bubble"><div class="who">${esc(who)}</div><div class="txt">${esc(txt)}</div></div></div>`;
      }).join('')
      :'<div class="empty">The team talks here as they work — execute the project to watch them.</div>'}</div>`));

  // artifacts
  el.append($(`<div class="panel"><h2>Deliverables (${arts.length})</h2>${arts.length?arts.map(a=>`
    <div class="art-card"><div class="ah"><span class="muted">${esc(dept(a.department_id))}</span> · ${esc(a.task_goal)}
      ${a.blocked?badge('blocked'):a.needs_human?badge('human'):badge(a.status)}
      <span class="spacer"></span><span class="faint">v${a.version}</span></div>
      ${a.block_reason?`<div class="faint" style="color:var(--red);margin-top:6px">⛔ ${esc(a.block_reason)}</div>`:''}
      <pre class="art">${esc(a.content)||'<span class="faint">(empty)</span>'}</pre></div>`).join(''):'<div class="empty">No deliverables yet — execute the project.</div>'}</div>`));

  // handoffs
  el.append($(`<div class="panel"><h2>Cross-department handoffs (${hos.length})</h2>${hos.length?hos.map(h=>`
    <div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
      <span class="badge">${esc(dept(h.from_department_id))} → ${esc(dept(h.to_department_id))}</span>
      <span class="muted">${esc(h.context)}</span><span class="spacer"></span><span class="faint">${h.evidence.length} evidence</span></div>`).join(''):'<div class="empty">None.</div>'}</div>`));

  // shared memory — what each agent wrote for the team to build on
  el.append($(`<div class="panel"><h2>Shared project memory (${mem.length})</h2>
    <p class="muted" style="margin:-6px 0 12px">Each agent reads this before working, and writes to it after — so the team builds on itself instead of starting blank.</p>
    ${mem.length?mem.map(m=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--border)">
        <span class="chip">${esc(dept(m.department_id))}</span><span class="muted">${esc(m.content)}</span></div>`).join(''):'<div class="empty">Empty until the project executes.</div>'}</div>`));

  // while agents are working, keep refreshing so the chat + deliverables stream in live
  clearTimeout(_ptimer);
  if(p.status==='executing' && location.hash.indexOf('/project/'+id) >= 0)
    _ptimer=setTimeout(()=>V.project(id), 6000);
};

V.leads = async () => {
  setTitle('Leads / CRM','qualification pipeline');
  const el = document.getElementById('view'); el.innerHTML='';
  el.append($(`<div class="panel"><h2>New lead</h2>
    <div class="form-grid">
      <div><label>Company</label><input id="l-co" placeholder="Globex"></div>
      <div><label>Industry</label><input id="l-ind" placeholder="software / med-spa"></div>
      <div><label>Size (employees)</label><input id="l-size" type="number" placeholder="200"></div>
      <div><label>Budget</label><input id="l-bud" placeholder="$80k"></div>
      <div><label>Authority</label><input id="l-auth" placeholder="VP Eng"></div>
      <div><label>Need</label><input id="l-need" placeholder="replace legacy"></div>
      <div><label>Timeline</label><input id="l-time" placeholder="this quarter"></div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn btn-primary" onclick="createLead()">Create &amp; qualify</button></div></div>`));
  const leads = await api('GET','/leads').catch(()=>[]);
  el.append($(`<div class="panel"><h2>Leads (${leads.length})</h2>${leads.length?leads.map(l=>`
    <div class="art-card"><div class="ah"><b>${esc(l.company)}</b> ${badge(l.qualification_state)}
      <span class="faint">ICP ${l.icp_fit_score} · conf ${l.confidence} · ${esc(l.framework)}</span>
      <span class="spacer"></span>${l.handoff_packet_id?'<span class="badge b-ok">handoff→sales</span>':''}</div>
      ${l.disqualify_reason?`<div class="faint" style="margin-top:6px">${esc(l.disqualify_reason)}</div>`:''}
      ${l.evidence&&l.evidence.length?`<div style="margin-top:8px">${l.evidence.map(e=>`<span class="chip">${e.present?'✓':'·'} ${esc(e.claim)}${e.present?': '+esc(e.evidence):''}</span>`).join('')}</div>`:''}
    </div>`).join(''):'<div class="empty">No leads yet.</div>'}</div>`));
};

V.controls = async () => {
  setTitle('Governance','controls & safety');
  const s = await api('GET','/console/standup');
  const el = document.getElementById('view'); el.innerHTML='';
  const pct = Math.min(100, s.cost.cap_usd? (s.cost.spent_usd/s.cost.cap_usd*100):0);
  el.append($(`<div class="panel"><h2>Budget</h2>
    <div class="kv"><span>spent <b>$${s.cost.spent_usd}</b></span><span>cap <b>$${s.cost.cap_usd}</b></span><span>remaining <b>$${s.cost.remaining_usd}</b></span></div>
    <div style="height:8px;background:var(--surface2);border-radius:6px;margin-top:10px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct>90?'var(--red)':'var(--accent)'}"></div></div></div>`));
  el.append($(`<div class="panel"><h2>Kill switch &amp; simulation</h2>
    <div class="kv" style="margin-bottom:12px">Global halt: ${s.controls.killed?badge('blocked'):badge('active')} &nbsp; Simulation: ${s.controls.simulation?badge('running'):'<span class="badge">off</span>'}</div>
    <div class="row">
      <button class="btn btn-danger" onclick="ctl('/governance/kill','Kill switch engaged')">Engage kill switch</button>
      <button class="btn" onclick="ctl('/governance/resume','Resumed')">Resume</button>
      <button class="btn" onclick="ctl('/governance/simulation?on=true','Simulation on')">Simulation on</button>
      <button class="btn" onclick="ctl('/governance/simulation?on=false','Simulation off')">Simulation off</button>
    </div></div>`));
  el.append($(`<div class="panel"><h2>LeadForge webhook secret</h2>
    <p class="muted" style="margin:0 0 12px">Generate the long-lived secret LeadForge uses to post handoffs (shown once).</p>
    <div class="row"><button class="btn" onclick="genSecret()">Generate secret</button></div>
    <pre class="art" id="secret" style="display:none"></pre></div>`));
};

V.agents = async () => {
  setTitle('Agents','the AI workforce');
  const agents = await api('GET','/agents');
  const el=document.getElementById('view'); el.innerHTML='';
  el.append($(`<div class="panel"><h2>Workforce (${agents.length})</h2>
    ${agents.map(a=>`<div class="art-card"><div class="ah">
        <b>${esc(a.name)}</b> ${badge(a.role)} <span class="muted">${esc(a.department)}</span>
        <span class="spacer"></span>
        <span class="chip">${esc(a.provider)}:${esc(a.model)}</span><span class="chip">autonomy ${esc(a.autonomy)}</span></div>
      <div class="grid cards" style="margin-top:11px">
        ${scTile('Tasks done', a.scorecard.tasks_completed)}
        ${scTile('First-pass', pct(a.scorecard.first_pass_rate))}
        ${scTile('Rework', pct(a.scorecard.rework_rate))}
        ${scTile('Escalation', pct(a.scorecard.escalation_rate))}
        ${scTile('Runs', a.scorecard.runs)}
        ${scTile('Cost/task', '$'+a.scorecard.cost_per_task)}
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px;margin-top:11px">
        <div><div class="lbl muted" style="margin-bottom:5px">✓ Completed (${a.completed.length})</div>
          ${a.completed.length?a.completed.map(g=>`<div class="chip" style="background:rgba(52,211,153,.1)">${esc(g).slice(0,42)}</div>`).join(''):'<span class="faint">none yet</span>'}</div>
        <div><div class="lbl muted" style="margin-bottom:5px">○ To-do (${a.todo.length})</div>
          ${a.todo.length?a.todo.map(g=>`<div class="chip">${esc(g).slice(0,42)}</div>`).join(''):'<span class="faint">nothing pending</span>'}</div>
      </div>
      <div class="row" style="margin-top:11px"><input id="q_${a.id}" placeholder="Ask ${esc(a.name)} for a status update or anything…" style="flex:1"><button class="btn btn-sm" onclick="askAgent('${a.id}')">Ask</button></div>
      <div class="faint" id="ans_${a.id}" style="margin-top:9px;white-space:pre-wrap;line-height:1.5"></div>
      </div>`).join('')}</div>`));
};

async function askAgent(id){
  const q=(document.getElementById('q_'+id)||{}).value||''; const out=document.getElementById('ans_'+id);
  if(!q.trim()){return}
  out.textContent='…thinking (local model, ~30s)…';
  try{ const r=await api('POST','/agents/'+id+'/ask',{question:q}); out.textContent='💬 '+r.answer; }
  catch(e){ out.textContent='Error: '+(e.detail||e.status); }
}

V.activity = async () => {
  setTitle('Activity','agent runs, newest first');
  const runs = await api('GET','/activity');
  const el=document.getElementById('view'); el.innerHTML='';
  el.append($(`<div class="panel"><h2>Recent agent runs (${runs.length})</h2>
    ${runs.length?`<table><thead><tr><th>Agent</th><th>Did</th><th>Status</th><th>Turns</th><th>Cost</th><th>When</th></tr></thead>
      <tbody>${runs.map(r=>`<tr><td><b>${esc(r.agent||r.role)}</b> <span class="muted">· ${esc(r.department)}</span></td>
        <td>${esc(r.trigger)||'<span class="faint">—</span>'}</td><td>${badge(r.status)}</td>
        <td class="muted">${r.turns}</td><td class="muted">$${r.cost_usd}</td>
        <td class="faint">${r.started_at?new Date(r.started_at).toLocaleTimeString():'—'}</td></tr>`).join('')}</tbody></table>`
      :'<div class="empty">No agent runs yet. Approve &amp; execute a project to put the agents to work.</div>'}</div>`));
};

// ---------- shared renderers ----------
function projectTable(projs){
  return `<table><thead><tr><th>Goal</th><th>Status</th><th>Health</th><th>Tasks</th><th>Due</th></tr></thead><tbody>${
    projs.map(p=>`<tr class="clik" onclick="location.hash='#/project/${p.id}'">
      <td>${esc(p.goal).slice(0,70)}</td><td>${badge(p.status)}</td><td>${badge(p.health)}</td>
      <td class="muted">${p.tasks}</td><td class="muted">${p.due_at?new Date(p.due_at).toLocaleDateString():'—'}</td></tr>`).join('')}</tbody></table>`;
}
function renderApprovals(appr){
  if(!appr.length) return '<div class="empty">Nothing awaiting you.</div>';
  return appr.map(a=>`<div class="art-card"><div class="ah">${badge(a.action_type)} <span class="muted">${esc(a.preview)}</span></div>
    <div class="row" style="margin-top:9px"><input id="r_${a.id}" placeholder="reason (for reject)" style="flex:1">
      <button class="btn btn-primary btn-sm" data-ap="${a.id}">Approve</button>
      <button class="btn btn-danger btn-sm" data-rj="${a.id}">Reject</button></div></div>`).join('');
}
function bindApprovals(){
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>decide(b.dataset.ap,'approve'));
  document.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>decide(b.dataset.rj,'reject'));
}

// ---------- actions ----------
async function directive(){
  const goal=(document.getElementById('goal').value||'').trim(); const m=document.getElementById('dmsg');
  if(!goal){ m.textContent='Enter a goal first.'; return; }
  m.textContent='Planning…';
  try{ const p=await api('POST','/projects',{goal});
    toast(`Plan drafted — ${p.tasks.length} tasks. Click ▶ Run it.`,'ok');
    location.hash='#/project/'+p.id;   // land on the project so Run is one click away
  }catch(e){ m.textContent='Error '+(e.status||'')+': '+(e.detail||''); }
}
let _ptimer=null;
async function runProject(id){   // one click: approve (if needed) + execute + watch live
  try{
    const p=await api('GET','/projects/'+id);
    if(p.status==='planning') await api('POST','/projects/'+id+'/approve');
    await api('POST','/projects/'+id+'/execute');
    toast('Running — agents are working, watch the Team chat','ok');
    V.project(id);
  }catch(e){ toast('Error '+(e.status||'')+': '+(e.detail||''),'err'); }
}
async function act(id, what){
  try{
    await api('POST',`/projects/${id}/${what}`);
    toast(what==='execute'?'Agents are working — watch the Team chat fill in':(what+'d'),'ok');
    V.project(id);   // re-renders; while status is "executing" it self-refreshes
  }catch(e){ toast('Error '+(e.status||'')+': '+(e.detail||''),'err'); }
}
async function decide(id, decision){
  const reason=(document.getElementById('r_'+id)||{}).value||null;
  try{ await api('POST',`/approvals/${id}/decide`,{decision,reason}); toast(decision==='approve'?'Approved':'Rejected','ok'); render(); }
  catch(e){ toast('Error: '+(e.detail||e.status),'err'); }
}
async function createLead(){
  const g=id=>document.getElementById(id).value;
  const attrs={}; [['budget','l-bud'],['authority','l-auth'],['need','l-need'],['timeline','l-time']].forEach(([k,i])=>{if(g(i))attrs[k]=g(i)});
  try{ const lead=await api('POST','/leads',{company:g('l-co'),industry:g('l-ind')||null,size_employees:g('l-size')?+g('l-size'):null,attributes:attrs});
    await api('POST',`/leads/${lead.id}/qualify`); toast('Lead qualified','ok'); V.leads();
  }catch(e){ toast('Error: '+(e.detail||e.status),'err'); }
}
async function ctl(path,msg){ try{ await api('POST',path); toast(msg,'ok'); V.controls(); }catch(e){ toast('Error: '+(e.detail||e.status),'err'); } }
async function genSecret(){ try{ const r=await api('POST','/integrations/leadforge/secret'); const el=document.getElementById('secret'); el.style.display='block'; el.textContent='X-LeadForge-Secret: '+r.secret+'\n\n'+r.note; toast('Secret generated','ok'); }catch(e){ toast('Error: '+(e.detail||e.status),'err'); } }

// ---------- router / boot ----------
function setTitle(t,s){ document.getElementById('pg-title').innerHTML=t; document.getElementById('pg-sub').textContent=s||''; }
let _rq=Promise.resolve();
function render(){ _rq=_rq.then(_render).catch(()=>{}); return _rq; }   // serialize: no overlapping renders
async function _render(){
  const hash=location.hash.replace('#/','')||'dashboard';
  const [k,arg]=hash.split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===k));
  try{ if(k==='project') await V.project(arg); else await (V[k]||V.dashboard)(); }
  catch(e){ if(e.status!==401) document.getElementById('view').innerHTML=`<div class="panel"><div class="empty">Error ${e.status||''}: ${esc(e.detail||'request failed')}</div></div>`; }
}
async function connect(){
  const t=cleanTok(document.getElementById('gate-tok').value);
  if(!t){ document.getElementById('gate-err').textContent='Paste a token.'; return; }
  S.tok=t; localStorage.setItem('cos_tok',t);
  try{ await boot(); }catch(e){ document.getElementById('gate-err').textContent='Token rejected ('+(e.status||'')+').'; localStorage.removeItem('cos_tok'); S.tok=''; }
}
function logout(){ localStorage.removeItem('cos_tok'); S.tok=''; document.getElementById('app').style.display='none'; document.getElementById('gate').style.display='grid'; }
async function boot(){
  const depts = await api('GET','/departments');    // validates token + caches names
  S.depts={}; depts.forEach(d=>S.depts[d.id]=d.name);
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('conn').classList.add('ok'); document.getElementById('conn-txt').textContent='connected';
  drawNav(); if(location.hash) render(); else location.hash='#/dashboard';  // hash change fires render once
}
window.addEventListener('hashchange', render);
window.addEventListener('load', ()=>{ if(S.tok){ boot().catch(()=>logout()); } });
</script>
