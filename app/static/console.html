<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company OS — Console</title>
<script>
  (function(){
    var t = localStorage.getItem('cos_theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root{
    --bg:#faf8f3; --surface:#ffffff; --surface2:#f5f1e8; --surface3:#efe9dc;
    --border:#ece6d8; --border2:#ddd4bf;
    --text:#17140f; --text2:#5c5648; --text3:#9b9484;
    --ink:#181510; --ink2:#302a20;
    --gold:#b9822c; --gold-soft:#faf1e0;
    --blue:#3454d1; --blue-soft:#eaeefb;
    --green:#1f8a4c; --green-soft:#e9f6ee;
    --amber:#b3690f; --amber-soft:#fbf0dd;
    --red:#c23c2d; --red-soft:#fbebe8;
    --purple:#7c4fd0; --purple-soft:#f2ecfc;
    --shadow:0 1px 2px rgba(30,24,10,.05), 0 1px 10px rgba(30,24,10,.04);
    --shadow-md:0 10px 34px rgba(30,24,10,.12), 0 2px 6px rgba(30,24,10,.06);
    --r:16px; --r-sm:11px; --r-pill:999px;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg:#0d0e12; --surface:#15171d; --surface2:#1b1e26; --surface3:#22252f;
    --border:#262933; --border2:#343846;
    --text:#eeefF3; --text2:#a2a6b4; --text3:#666b7a;
    --ink:#f4f2ec; --ink2:#e7e3d7;
    --gold:#e0ab54; --gold-soft:#2c2415;
    --blue:#7f93f0; --blue-soft:#1c2036;
    --green:#59d68c; --green-soft:#122a1c;
    --amber:#e3a54e; --amber-soft:#2a2214;
    --red:#f28a7c; --red-soft:#2c1715;
    --purple:#b795f5; --purple-soft:#241c37;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 1px 8px rgba(0,0,0,.22);
    --shadow-md:0 12px 36px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14.5px/1.6 -apple-system,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  ::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:8px}
  svg{display:block}

  /* ===== layout ===== */
  #app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

  /* sidebar is ALWAYS dark, independent of the content theme toggle */
  aside{background:linear-gradient(190deg,#131319,#0a0a0e 60%);border-right:1px solid #1d1d24;
    display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:hidden}
  .brand{display:flex;align-items:center;gap:12px;padding:6px 8px 26px}
  .brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(155deg,#fff,#c9c2b0);
    color:#15130e;display:grid;place-items:center;font-size:17px;font-weight:800;flex:0 0 38px}
  .brand .bt{color:#f3f1ea;font-weight:700;font-size:15.5px;line-height:1.25}
  .brand .bs{color:#7d7d88;font-size:11.5px;font-weight:500}
  nav{display:flex;flex-direction:column;gap:2px;position:relative;z-index:2}
  nav a{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:11px;color:#9a9aa4;
    font-weight:560;cursor:pointer;font-size:13.6px;transition:background .12s,color .12s}
  nav a svg{width:17px;height:17px;opacity:.8;flex:0 0 17px}
  nav a:hover{background:#1a1a21;color:#e5e3da}
  nav a.active{background:var(--gold-soft);color:var(--gold);font-weight:650}
  nav a.active svg{opacity:1;color:var(--gold)}

  .side-glow{position:absolute;left:-30px;bottom:170px;width:230px;height:230px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#e7cf9c,#b9822c 55%,transparent 78%);opacity:.5;
    filter:blur(6px);z-index:1;pointer-events:none}
  .side-hill{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,transparent,#0a0a0e 85%)}

  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px;position:relative;z-index:2}
  .conn{display:flex;align-items:center;gap:9px;padding:11px 13px;background:#16161d;
    border:1px solid #232329;border-radius:12px;font-size:12.3px;color:#c7c6cf}
  .conn .led{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 7px}
  .conn.ok .led{background:#3ee27e;box-shadow:0 0 0 3px rgba(62,226,126,.18);animation:pulse 2.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(62,226,126,.18)}50%{box-shadow:0 0 0 5.5px rgba(62,226,126,.1)}}
  .who{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#16161d;border:1px solid #232329;
    border-radius:12px;cursor:pointer}
  .who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(155deg,var(--gold),#8a5f1e);
    color:#1a1408;font-weight:800;font-size:13px;display:grid;place-items:center;flex:0 0 32px}
  .who .wt{flex:1;min-width:0}
  .who .wn{color:#eceae2;font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .we{color:#83838d;font-size:11.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who svg{width:14px;height:14px;color:#6c6c76;flex:0 0 14px}
  .signout{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:12px;color:#8f8f99;
    font-weight:600;font-size:12.6px;cursor:pointer}
  .signout:hover{background:#1a1a21;color:var(--red)}
  .signout svg{width:14.5px;height:14.5px}

  main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:22px 34px 10px;
    background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(10px)}
  .topbar h1{margin:0;font-size:23px;font-weight:750;letter-spacing:-.015em}
  .topbar .sub{color:var(--text3);font-size:13.3px;margin-top:2px}
  .spacer{flex:1}
  .content{padding:14px 34px 60px;max-width:1280px;width:100%}

  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-pill);padding:10px 15px;width:280px;color:var(--text3);cursor:text;transition:.12s}
  .search:focus-within{border-color:var(--border2);box-shadow:var(--shadow)}
  .search svg{width:15.5px;height:15.5px;flex:0 0 15.5px}
  .search input{border:none;padding:0;background:transparent;width:100%;font-size:13.4px}
  .search input:focus{box-shadow:none}
  .kbd{font-size:10.5px;font-weight:700;color:var(--text3);border:1px solid var(--border2);border-radius:5px;
    padding:1.5px 5.5px;background:var(--surface2);flex:0 0 auto}

  .icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r-pill);
    border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;
    flex:0 0 38px;position:relative;transition:.12s}
  .icon-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
  .icon-btn svg{width:16.5px;height:16.5px}
  .icon-btn .dot{position:absolute;top:6px;right:6px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
    background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center}
  .theme-btn .moon{display:none} :root[data-theme="dark"] .theme-btn .sun{display:none} :root[data-theme="dark"] .theme-btn .moon{display:block}

  .new-wrap{position:relative}
  .btn-new{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fbf9f4;border:none;
    padding:10.5px 17px 10.5px 15px;border-radius:var(--r-pill);font-weight:650;font-size:13.6px;cursor:pointer;
    box-shadow:0 4px 14px rgba(20,17,10,.24)}
  .btn-new:hover{background:var(--ink2)}
  .btn-new svg{width:15px;height:15px}
  .menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-sm);box-shadow:var(--shadow-md);min-width:190px;padding:6px;z-index:30;display:none}
  .menu.open{display:block}
  .menu a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:13.3px;
    font-weight:560;color:var(--text);cursor:pointer}
  .menu a:hover{background:var(--surface2)}
  .menu a svg{width:15px;height:15px;color:var(--text3)}

  /* ===== primitives ===== */
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;
    margin-bottom:16px;box-shadow:var(--shadow);animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
  .panel h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.005em;color:var(--text)}
  .panel .h-row{display:flex;align-items:center;margin-bottom:17px}
  .panel .h-sub{color:var(--text3);font-size:12px;margin-top:1px;font-weight:500}
  .pill-select{font-size:12.3px;font-weight:600;color:var(--text2);background:var(--surface2);
    border:1px solid var(--border);border-radius:var(--r-pill);padding:6px 13px 6px 13px;display:inline-flex;
    align-items:center;gap:5px}
  .pill-select svg{width:12px;height:12px}
  .link-more{color:var(--text);font-weight:650;font-size:12.8px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .link-more:hover{color:var(--gold)}
  .link-more svg{width:13px;height:13px}

  /* ---- hero directive card ---- */
  .hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#1a1712,#0d0c09 75%);
    border-radius:20px;padding:30px 34px;margin-bottom:16px;box-shadow:var(--shadow-md);
    display:flex;align-items:center;gap:26px;animation:rise .3s cubic-bezier(.2,.7,.3,1) both}
  .hero-orb{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:270px;height:270px;
    pointer-events:none}
  .hero-orb i{position:absolute;border-radius:50%;display:block}
  .hero-orb .o1{width:230px;height:230px;right:0;top:10px;
    background:radial-gradient(circle at 32% 28%,#f2e2bd,#c69a4c 55%,#8a6a2c 85%);opacity:.9;filter:blur(.3px)}
  .hero-orb .o2{width:96px;height:96px;right:150px;top:130px;
    background:radial-gradient(circle at 34% 28%,#2b2822,#0e0c09 78%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  .hero-orb .o3{width:150px;height:150px;right:36px;top:0;border-radius:24px;transform:rotate(18deg);
    background:linear-gradient(155deg,#2a2620,#141210);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .hero-icon{width:56px;height:56px;border-radius:16px;background:#211d16;border:1px solid #34301f;
    display:grid;place-items:center;flex:0 0 56px;position:relative;z-index:2}
  .hero-icon svg{width:24px;height:24px;color:var(--gold)}
  .hero-body{flex:1;min-width:0;position:relative;z-index:2}
  .hero-body h2{margin:0 0 3px;color:#f7f4ec;font-size:19px;font-weight:750;letter-spacing:-.01em}
  .hero-body p{margin:0 0 16px;color:#a8a196;font-size:13.4px}
  .hero-row{display:flex;gap:10px;max-width:640px}
  .hero-row input{flex:1;background:#171410;border:1px solid #322c1f;color:#f2eee2;padding:12px 16px;
    border-radius:var(--r-pill);font-size:13.6px}
  .hero-row input::placeholder{color:#6f6a5c}
  .hero-row input:focus{border-color:var(--gold);box-shadow:0 0 0 3.5px rgba(185,130,44,.16)}
  .hero-row button{background:#f2ecdd;color:#171410;border:none;padding:12px 22px;border-radius:var(--r-pill);
    font-weight:700;font-size:13.6px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
  .hero-row button:hover{background:#fff}
  .hero-msg{color:#8f8a7c;font-size:12.3px;margin-top:9px;position:relative;z-index:2}

  /* ---- stat cards ---- */
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:17px 18px;
    display:flex;flex-direction:column;gap:12px;transition:transform .12s,box-shadow .12s}
  .kpi:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 38px}
  .ic svg{width:18px;height:18px}
  .ic-blue{background:var(--blue-soft);color:var(--blue)} .ic-green{background:var(--green-soft);color:var(--green)}
  .ic-amber{background:var(--amber-soft);color:var(--amber)} .ic-red{background:var(--red-soft);color:var(--red)}
  .ic-purple{background:var(--purple-soft);color:var(--purple)} .ic-gold{background:var(--gold-soft);color:var(--gold)}
  .kpi .kl{font-size:12.6px;color:var(--text2);font-weight:600}
  .kpi .kv2{font-size:25px;font-weight:750;letter-spacing:-.02em;color:var(--text);margin-top:2px}
  .kpi .kc{font-size:11.8px;color:var(--text3);margin-top:1px}
  .kpi.good .kc{color:var(--green)} .kpi.warn .kc{color:var(--amber)} .kpi.bad .kc{color:var(--red)}

  /* ---- list rows (decision queue / activity) ---- */
  .lrow{display:flex;align-items:center;gap:13px;padding:13px 4px;border-top:1px solid var(--border)}
  .lrow:first-child{border-top:none;padding-top:2px}
  .lrow .lt{flex:1;min-width:0}
  .lrow .ltitle{font-weight:650;font-size:13.7px;color:var(--text)}
  .lrow .lsub{font-size:12.3px;color:var(--text3);margin-top:1.5px}
  .lrow .lmeta{text-align:right;font-size:11.6px;color:var(--text3);white-space:nowrap}
  .tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3.5px 10px;
    border-radius:var(--r-pill);white-space:nowrap}
  .tag-blue{background:var(--blue-soft);color:var(--blue)} .tag-green{background:var(--green-soft);color:var(--green)}
  .tag-amber{background:var(--amber-soft);color:var(--amber)} .tag-red{background:var(--red-soft);color:var(--red)}
  .tag-purple{background:var(--purple-soft);color:var(--purple)} .tag-gray{background:var(--surface2);color:var(--text2)}

  /* ---- donut ---- */
  .donut-wrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .donut{width:150px;height:150px;border-radius:50%;flex:0 0 150px;position:relative;display:grid;place-items:center}
  .donut::before{content:"";position:absolute;inset:20px;background:var(--surface);border-radius:50%}
  .donut b{position:relative;z-index:2;font-size:23px;font-weight:800;letter-spacing:-.02em}
  .donut span{position:relative;z-index:2;font-size:10.6px;color:var(--text3);font-weight:600;margin-top:2px}
  .donut-inner{display:flex;flex-direction:column;align-items:center}
  .legend{display:flex;flex-direction:column;gap:11px;flex:1;min-width:160px}
  .legend .lg-row{display:flex;align-items:center;gap:9px;font-size:12.8px}
  .legend .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .legend .lg-name{flex:1;color:var(--text2);font-weight:560}
  .legend .lg-val{font-weight:700;color:var(--text)}

  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border2);background:var(--surface);
    color:var(--text);padding:9px 16px;border-radius:var(--r-pill);font:inherit;font-weight:640;font-size:13.4px;
    cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--text3);background:var(--surface2)}
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fbf9f4;box-shadow:0 3px 10px rgba(20,17,10,.2)}
  .btn-primary:hover{background:var(--ink2);border-color:var(--ink2)}
  .btn-danger{background:transparent;border-color:var(--red);color:var(--red)}
  .btn-danger:hover{background:var(--red-soft);border-color:var(--red)}
  .btn-sm{padding:7.5px 13px;font-size:12.6px;border-radius:var(--r-sm)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

  input,textarea,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border2);
    border-radius:var(--r-sm);padding:9.5px 12px;width:100%;transition:.12s}
  input::placeholder,textarea::placeholder{color:var(--text3)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--text3);box-shadow:0 0 0 3.5px var(--surface2)}
  label{display:block;font-size:12px;font-weight:650;color:var(--text2);margin:0 0 5px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}

  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);
    font-weight:700;padding:0 12px 10px}
  td{padding:13px 12px;border-top:1px solid var(--border);font-size:13.8px}
  tr.clik{cursor:pointer;transition:background .1s} tr.clik:hover td{background:var(--surface2)}
  tr:first-child td{border-top:none}

  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.6px;font-weight:650;padding:3.5px 10px;
    border-radius:var(--r-pill);background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}
  .b-done,.b-ok,.b-qualified,.b-approved{color:var(--green);background:var(--green-soft);border-color:transparent}
  .b-active,.b-running,.b-reviewed{color:var(--blue);background:var(--blue-soft);border-color:transparent}
  .b-planning,.b-scheduled,.b-proposed,.b-pending{color:var(--amber);background:var(--amber-soft);border-color:transparent}
  .b-slip,.b-slipping,.b-blocked,.b-disqualified,.b-failed{color:var(--red);background:var(--red-soft);border-color:transparent}
  .b-human,.b-insufficient_info,.b-at_risk{color:var(--purple);background:var(--purple-soft);border-color:transparent}
  .chip{display:inline-block;font-size:12px;padding:4px 10px;border-radius:8px;background:var(--surface2);
    border:1px solid var(--border);color:var(--text2);margin:0 6px 6px 0;font-weight:500}
  .star{color:var(--gold)}
  .muted{color:var(--text2)} .faint{color:var(--text3)}
  .empty{color:var(--text3);padding:44px 20px;text-align:center;display:flex;flex-direction:column;
    align-items:center;gap:12px}
  .empty svg{width:36px;height:36px;opacity:.4}
  .empty div{font-size:13.5px;max-width:320px;line-height:1.5}
  pre.art{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);
    padding:14px 16px;margin:9px 0 0;max-height:320px;overflow:auto;
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,'Cascadia Code',monospace;color:var(--text)}
  .art-card{border:1px solid var(--border);border-radius:var(--r-sm);padding:15px 17px;margin-bottom:12px;
    background:var(--surface);transition:border-color .12s}
  .art-card:hover{border-color:var(--border2)}
  .art-card .ah{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .back{color:var(--text2);cursor:pointer;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:5px}
  .back:hover{color:var(--text)}
  .kv{display:flex;gap:22px;flex-wrap:wrap;color:var(--text2);font-size:13px}
  .kv b{color:var(--text);font-weight:650}

  /* chat */
  .chatmsg{display:flex;gap:11px;margin:0 0 16px;align-items:flex-start;animation:rise .22s ease both}
  .chatmsg.me{flex-direction:row-reverse}
  .avatar{width:32px;height:32px;border-radius:50%;flex:0 0 32px;display:grid;place-items:center;
    font-weight:700;font-size:13px;background:var(--ink);color:#fff}
  .chatmsg.me .avatar{background:var(--surface3);color:var(--text)}
  .chat-col{display:flex;flex-direction:column;max-width:72%}
  .chatmsg.me .chat-col{align-items:flex-end}
  .chat-meta{font-size:11.5px;margin-bottom:4px;color:var(--text3)}
  .chat-meta b{color:var(--text2);font-weight:650}
  .chatbody{white-space:pre-wrap;line-height:1.58;background:var(--surface2);border:1px solid var(--border);
    border-radius:4px 14px 14px 14px;padding:11px 15px;font-size:13.8px}
  .chatmsg.me .chatbody{background:var(--ink);color:#fbf9f4;border:none;border-radius:14px 4px 14px 14px}

  #toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:200}
  .toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r-sm);padding:12px 16px;min-width:250px;box-shadow:var(--shadow-md);
    animation:toastin .22s cubic-bezier(.2,.8,.3,1)}
  .toast svg{width:17px;height:17px;flex:0 0 17px;color:var(--text)}
  .toast.err svg{color:var(--red)} .toast.ok svg{color:var(--green)}
  @keyframes toastin{from{opacity:0;transform:translateY(10px) scale(.97)}}

  .sk{background:linear-gradient(100deg,var(--surface2) 30%,var(--surface3) 50%,var(--surface2) 70%);
    background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:6px}
  @keyframes shimmer{to{background-position:-200% 0}}

  /* auth gate */
  #gate{position:fixed;inset:0;background:
    radial-gradient(900px 600px at 10% -10%, var(--gold-soft), transparent),
    radial-gradient(700px 500px at 110% 10%, var(--purple-soft), transparent), var(--bg);
    display:grid;place-items:center;z-index:100}
  #gate .box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:38px;
    width:min(420px,92vw);box-shadow:var(--shadow-md)}
  #gate .gate-mark{width:46px;height:46px;border-radius:13px;background:var(--ink);
    display:grid;place-items:center;color:#fbf9f4;font-weight:800;font-size:19px;margin-bottom:18px}
  #gate h2{margin:0 0 6px;font-weight:750;font-size:23px;letter-spacing:-.01em}
  #gate p{color:var(--text2);margin:0 0 22px;font-size:13.6px}
  #gate .gate-field{margin-bottom:14px}
  #gate .gate-actions{display:flex;align-items:center;gap:14px;margin-top:20px}
  #gate-err{min-height:18px;font-size:12.8px;color:var(--red);margin-top:12px}

  @media(max-width:920px){
    #app{grid-template-columns:1fr}
    aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:6px;padding:14px}
    .side-foot,.side-glow,.side-hill{display:none}
    nav{flex-direction:row;flex-wrap:wrap}
    .content{padding:16px}
    .topbar{padding:16px 18px;flex-wrap:wrap}
    .search{width:100%;order:5}
    .hero{flex-direction:column;align-items:flex-start}
    .hero-orb{display:none}
  }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <div class="gate-mark">C</div>
    <h2>Welcome back</h2>
    <p>Sign in to your Company OS console.</p>
    <div class="gate-field"><label>Email</label>
      <input id="gate-email" type="email" autocomplete="username" placeholder="you@company.com"></div>
    <div class="gate-field"><label>Password</label>
      <input id="gate-pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div class="gate-actions">
      <button class="btn btn-primary" id="gate-btn" onclick="connect()" style="flex:1;justify-content:center">Sign in</button>
      <a class="back" href="/docs" target="_blank">API docs →</a>
    </div>
    <div id="gate-err"></div>
  </div>
</div>

<div id="app" style="display:none">
  <aside>
    <div class="brand"><span class="mark">C</span><span><div class="bt">Company OS</div><div class="bs">Operate with clarity.</div></span></div>
    <nav id="nav"></nav>
    <div class="side-glow"></div><div class="side-hill"></div>
    <div class="side-foot">
      <div class="conn" id="conn"><span class="led"></span><span id="conn-txt">disconnected</span></div>
      <div class="who" onclick="logout()" title="Sign out">
        <span class="av" id="who-av">·</span>
        <span class="wt"><div class="wn" id="who-name">—</div><div class="we" id="who-email"></div></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="signout" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sign out
      </div>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="pg-title">Dashboard</h1><div class="sub" id="pg-sub"></div></div>
      <span class="spacer"></span>
      <div class="search" onclick="document.getElementById('topsearch').focus()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="topsearch" placeholder="Search anything…">
        <span class="kbd">⌘K</span>
      </div>
      <span class="icon-btn" id="bell-btn" onclick="ringBell()" title="Decisions awaiting you">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot" id="bell-dot" style="display:none">0</span>
      </span>
      <span class="icon-btn theme-btn" onclick="toggleTheme()" title="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
      </span>
      <div class="new-wrap">
        <button class="btn-new" onclick="toggleNewMenu()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;opacity:.7"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="menu" id="new-menu">
          <a onclick="newProject()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v16h-4z"/></svg>New project</a>
          <a onclick="newLead()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/></svg>New lead</a>
        </div>
      </div>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="toasts"></div>

<script>
const cleanTok = (t) => (t || '').replace(/[^A-Za-z0-9._-]/g, '');  // strip stray spaces/newlines from pastes
const S = { tok: cleanTok(localStorage.getItem('cos_tok')), email: localStorage.getItem('cos_email')||'', depts: {} };
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const esc = (s) => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H = () => ({authorization:'Bearer '+S.tok,'content-type':'application/json'});
const badge = (s) => `<span class="badge b-${esc(s)}">${esc(s)}</span>`;
const dept = (id) => S.depts[id] || '—';
function timeAgo(iso){
  if(!iso) return '';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<5) return 'just now'; if(s<60) return Math.floor(s)+'s ago';
  const m=s/60; if(m<60) return Math.floor(m)+'m ago';
  const h=m/60; if(h<24) return Math.floor(h)+'h ago';
  const d=h/24; if(d<30) return Math.floor(d)+'d ago';
  return new Date(iso).toLocaleDateString();
}

// ---- theme ----
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t); localStorage.setItem('cos_theme', t); }
function toggleTheme(){ applyTheme(document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark'); }

// ---- toasts ----
const TOAST_ICONS = {
  ok:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
  err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
};
function toast(msg, kind){
  const t=$(`<div class="toast ${kind||''}">${TOAST_ICONS[kind]||TOAST_ICONS.info}<span>${esc(msg)}</span></div>`);
  document.getElementById('toasts').append(t); setTimeout(()=>t.remove(),3800);
}

async function api(method, path, body){
  const r = await fetch(path, {method, headers:H(), body: body?JSON.stringify(body):undefined});
  if(r.status===401){ toast('Session expired — reconnect','err'); logout(); throw {status:401}; }
  if(!r.ok){ let d; try{d=JSON.stringify((await r.json()).detail)}catch{d=await r.text()} throw {status:r.status, detail:d}; }
  const ct=r.headers.get('content-type')||''; return ct.includes('json')? r.json() : r.text();
}

const EMPTY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8l1.5-4.5A1 1 0 016.44 3h11.12a1 1 0 01.94.66L20 8"/><path d="M4 8h16v10a2 2 0 01-2 2H6a2 2 0 01-2-2V8z"/><path d="M4 8l3 4h10l3-4"/></svg>';
const empty = (msg) => `<div class="empty">${EMPTY_SVG}<div>${msg}</div></div>`;
const skeleton = () => `<div class="panel">
  <div class="sk" style="height:14px;width:40%;margin-bottom:18px"></div>
  <div class="sk" style="height:64px;margin-bottom:10px"></div>
  <div class="sk" style="height:64px"></div></div>`;

const NAV = [
  ['dashboard','Dashboard','M3 12l9-9 9 9M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10'],
  ['teamchat','Team chat','M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z'],
  ['projects','Projects','M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v16h-4z'],
  ['agents','Agents','M9 11a3 3 0 100-6 3 3 0 000 6zM3 20v-1a4 4 0 014-4h4a4 4 0 014 4v1M16 11a3 3 0 10-1-6M21 20v-1a4 4 0 00-3-3.8'],
  ['activity','Activity','M3 12h4l2.5 7 4-15L16 12h5'],
  ['leads','Leads / CRM','M9 6V4a2 2 0 012-2h2a2 2 0 012 2v2M4 7h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V7zM4 12h16'],
  ['controls','Governance','M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z'],
];
const pct = (x) => Math.round((x||0)*100)+'%';
const scTile = (l,v) => `<div class="stat"><span class="bar"></span><div class="lbl">${l}</div><div class="val" style="font-size:18px">${v}</div></div>`;
function drawNav(){
  document.getElementById('nav').innerHTML = NAV.map(([k,l,p])=>
    `<a data-k="${k}" onclick="go('${k}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>${l}</a>`).join('');
}
function go(k){ location.hash = '#/'+k; }

// ---- header widgets: search, bell, +New ----
function toggleNewMenu(){ document.getElementById('new-menu').classList.toggle('open'); }
document.addEventListener('click', e=>{
  const wrap=document.querySelector('.new-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('new-menu').classList.remove('open');
});
function newProject(){ document.getElementById('new-menu').classList.remove('open'); go('projects'); setTimeout(()=>document.getElementById('goal')?.focus(),80); }
function newLead(){ document.getElementById('new-menu').classList.remove('open'); go('leads'); setTimeout(()=>document.getElementById('l-co')?.focus(),80); }
function ringBell(){
  const q=document.getElementById('appr')||document.querySelector('#view');
  if(q) q.scrollIntoView({behavior:'smooth', block:'center'});
  if(location.hash.replace('#/','')!=='dashboard') go('dashboard');
}
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('topsearch')?.focus(); }
});
function searchGo(){
  const q=(document.getElementById('topsearch').value||'').trim().toLowerCase();
  const hit = NAV.find(([k,l])=> k===q || l.toLowerCase().includes(q));
  if(hit){ go(hit[0]); document.getElementById('topsearch').value=''; document.getElementById('topsearch').blur(); }
}

// ---------- views ----------
const V = {};

// ---- Team chat: assign work by @mentioning an agent ----------------------------------------
let CHAT_POLL = null;
const chatBubble = (m) => {
  const me = !m.is_agent;
  return `<div class="chatmsg ${me?'me':''}">
    <div class="avatar">${esc((m.sender||'?').trim()[0]||'?')}</div>
    <div class="chat-col">
      <div class="chat-meta"><b>${esc(m.sender)}</b>${m.department?' · '+esc(m.department):''}
        <span style="opacity:.7"> · ${esc((m.at||'').slice(11,16))}</span></div>
      <div class="chatbody">${esc(m.content)}</div>
    </div></div>`;
};

V.teamchat = async () => {
  const data = await api('GET','/teamchat');
  const el = document.getElementById('view'); el.innerHTML='';
  const handles = data.agents.map(a=>'@'+a.handle).join(' ');
  el.append($(`<div class="panel"><div class="h-row"><h2>Team chat</h2></div>
    <div class="faint" style="margin-bottom:14px;margin-top:-8px">Assign work by @mentioning an agent — it creates a
      real task, runs it through Critic + Legal, and posts the result back here.<br>
      Roster: <b style="color:var(--text2)">${esc(handles)}</b></div>
    <div id="chatlog" style="max-height:54vh;overflow:auto;padding-right:6px">
      ${data.messages.length?data.messages.map(chatBubble).join('')
        :empty('No messages yet. Try: <b>@cleo draft a proposal for the BizBuySell scrape</b>')}
    </div>
    <div class="row" style="margin-top:16px;gap:8px">
      <input id="chat-in" placeholder="@cleo draft a proposal for…" style="flex:1">
      <button class="btn btn-primary" onclick="sendChat()">Send</button>
    </div>
    <div class="faint" id="chat-hint" style="margin-top:8px"></div></div>`));
  const log = document.getElementById('chatlog'); log.scrollTop = log.scrollHeight;
  document.getElementById('chat-in').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
  document.getElementById('chat-in').focus();
};

async function sendChat(){
  const box = document.getElementById('chat-in'); const text = box.value.trim();
  if(!text) return;
  box.value=''; box.disabled=true;
  try{
    const r = await api('POST','/teamchat',{message:text});
    if(r.tasks.length){
      const who = r.tasks.map(t=>t.agent).join(', ');
      toast(`Assigned to ${who} — working now`,'ok');
      document.getElementById('chat-hint').textContent = `${who} working… their reply lands here when done.`;
      pollChat();   // agents take 30-90s on a real model; stream their replies in
    }
  }catch(e){ toast('Send failed ('+(e.status||'')+')','err'); }
  finally{ box.disabled=false; box.focus(); await V.teamchat(); }
}

function pollChat(){
  clearInterval(CHAT_POLL); let n=0;
  CHAT_POLL = setInterval(async ()=>{
    if(++n>60 || !location.hash.includes('teamchat')){ clearInterval(CHAT_POLL); return; }
    if(document.activeElement === document.getElementById('chat-in')) return;  // don't clobber typing
    await V.teamchat();
  }, 3000);
}

// ---- Dashboard ----
const KPI_META = {
  'Projects done':  {ic:'ic-green', svg:'<path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/>'},
  'Tasks done':     {ic:'ic-blue',  svg:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>'},
  'Slipping':       {ic:'ic-red',   svg:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>'},
  'At risk':        {ic:'ic-amber', svg:'<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4M12 17h.01"/>'},
  'Pending approvals':{ic:'ic-amber',svg:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>'},
  'Needs human':    {ic:'ic-purple',svg:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0116 0"/>'},
  'Blocked (legal)':{ic:'ic-red',   svg:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.5 9.5l5 5m0-5l-5 5"/>'},
  'Spent':          {ic:'ic-gold',  svg:'<path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>'},
};
function kpiCard(l,v,cap,tone){
  const m = KPI_META[l] || {ic:'ic-blue',svg:'<circle cx="12" cy="12" r="9"/>'};
  return `<div class="kpi ${tone||''}">
    <div class="ic ${m.ic}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.svg}</svg></div>
    <div><div class="kl">${l}</div><div class="kv2">${v}</div><div class="kc">${cap}</div></div></div>`;
}

V.dashboard = async () => {
  const hour = new Date().getHours();
  const greet = hour<12?'Good morning':hour<18?'Good afternoon':'Good evening';
  const name = (S.email.split('@')[0]||'there').replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  setTitle(`${greet}, ${esc(name)} 👋`, "Here's your overview for today.");

  const s = await api('GET','/console/standup');
  const el = document.getElementById('view');
  el.innerHTML = '';

  el.append($(`<div class="hero">
    <div class="hero-orb"><i class="o3"></i><i class="o2"></i><i class="o1"></i></div>
    <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></div>
    <div class="hero-body">
      <h2>Directive</h2>
      <p>Convert a high-level goal into an executable plan.</p>
      <div class="hero-row">
        <input id="goal" placeholder="State a goal — the Lead will decompose it into a plan">
        <button onclick="directive()">Plan it
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:13px;height:13px"><path d="M12 1l2.6 6.9L21 10l-6.4 2.1L12 19l-2.6-6.9L3 10l6.4-2.1z"/></svg>
        </button>
      </div>
      <div class="hero-msg" id="dmsg"></div>
    </div></div>`));

  const tp = s.shipped.projects_total ? Math.round(s.shipped.projects_done/s.shipped.projects_total*100) : 0;
  const tiles = [
    ['Projects done', s.shipped.projects_done+' / '+s.shipped.projects_total, tp+'% completed','good'],
    ['Tasks done', s.shipped.tasks_done, 'Total tasks',''],
    ['Slipping', s.at_risk.projects_slipping, 'Needs attention', s.at_risk.projects_slipping?'bad':''],
    ['At risk', s.at_risk.tasks_at_risk, 'Tasks flagged', s.at_risk.tasks_at_risk?'warn':''],
    ['Pending approvals', s.needs_you.pending_approvals, 'Waiting on you', s.needs_you.pending_approvals?'warn':''],
    ['Needs human', s.needs_you.artifacts_need_human, 'Review queue', s.needs_you.artifacts_need_human?'warn':''],
    ['Blocked (legal)', s.needs_you.artifacts_blocked_by_legal, 'Legal veto', s.needs_you.artifacts_blocked_by_legal?'bad':''],
    ['Spent', '$'+s.cost.spent_usd, 'of $'+s.cost.cap_usd+' cap', ''],
  ];
  el.append($(`<div class="panel"><div class="h-row"><h2>Standup digest</h2><span class="spacer"></span><span class="pill-select">This week</span></div>
    <div class="grid cards">${tiles.map(([l,v,c,tone])=>kpiCard(l,v,c,tone)).join('')}</div></div>`));

  const [appr, projs] = await Promise.all([
    api('GET','/approvals').catch(()=>[]),
    api('GET','/projects').catch(()=>[]),
  ]);
  updateBell(appr.length);

  el.append($(`<div class="grid" style="grid-template-columns:1.35fr 1fr;align-items:start">
    <div>
      <div class="panel" id="appr-panel"><div class="h-row"><h2>Decision queue</h2>
        ${appr.length?`<span class="badge" style="margin-left:9px">${appr.length}</span>`:''}
        <span class="spacer"></span><span class="link-more" onclick="go('controls')">View all
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div>
        <div id="appr">${renderApprovals(appr)}</div>
        ${appr.length?`<div class="row" style="margin-top:16px;justify-content:space-between">
          <span class="faint">${appr.length} decision${appr.length===1?'':'s'} awaiting your input</span>

function skeletonRows(){
  return `<div class="sk" style="height:44px;margin-bottom:10px"></div><div class="sk" style="height:44px;margin-bottom:10px"></div><div class="sk" style="height:44px"></div>`;
}
async function loadActivityMini(){
  try{
    const runs = await api('GET','/activity?limit=6');
    const body = document.getElementById('activity-mini-body');
    if(!body) return; // navigated away before this resolved
    body.innerHTML = runs.length ? runs.slice(0,6).map(activityRow).join('') : empty('No agent runs yet.');
  }catch(_){}
}
const ACT_ICON = {
  succeeded:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>',
  failed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  default:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
};
function activityRow(r){
  const ok = r.status==='succeeded'||r.status==='done';
  const bad = r.status==='failed';
  const ic = ok?ACT_ICON.succeeded:bad?ACT_ICON.failed:ACT_ICON.default;
  const tone = ok?'ic-green':bad?'ic-red':'ic-blue';
  return `<div class="lrow"><div class="ic ${tone}" style="width:32px;height:32px;flex:0 0 32px">${ic}</div>
    <div class="lt"><div class="ltitle">${esc(r.agent||r.role)}</div>
      <div class="lsub">${esc(r.trigger)||esc(r.department)||'ran a task'}</div></div>
    <div class="lmeta">${timeAgo(r.started_at)}</div></div>`;
}
function progressPanel(projs){
  const total = projs.length;
  if(!total) return `<div class="h-row"><h2>Progress overview</h2></div>${empty('Nothing to show yet — plan a project.')}`;
  const done = projs.filter(p=>p.status==='done').length;
  const active = projs.filter(p=>p.status==='active'||p.status==='executing').length;
  const risk = projs.filter(p=>p.health==='slipping').length;
  const pending = Math.max(0, total-done-active-risk);
  const pd=Math.round(done/total*100), pa=Math.round(active/total*100), pr=Math.round(risk/total*100);
  const pp=Math.max(0,100-pd-pa-pr);
  let acc=0; const seg=(p,color)=>{ const s=`${color} ${acc}% ${acc+p}%`; acc+=p; return s; };
  const grad = [seg(pd,'var(--green)'), seg(pa,'var(--blue)'), seg(pp,'var(--amber)'), seg(pr,'var(--red)')].join(', ');
  return `<div class="h-row"><h2>Progress overview</h2><span class="spacer"></span><span class="pill-select">All time</span></div>
    <div class="donut-wrap">
      <div class="donut" style="background:conic-gradient(${grad})"><b>${pd}%</b><span>Overall progress</span></div>
      <div class="legend">
        <div class="lg-row"><span class="dot" style="background:var(--green)"></span><span class="lg-name">Completed</span><span class="lg-val">${pd}%</span></div>
        <div class="lg-row"><span class="dot" style="background:var(--blue)"></span><span class="lg-name">In progress</span><span class="lg-val">${pa}%</span></div>
        <div class="lg-row"><span class="dot" style="background:var(--amber)"></span><span class="lg-name">Pending</span><span class="lg-val">${pp}%</span></div>
        <div class="lg-row"><span class="dot" style="background:var(--red)"></span><span class="lg-name">At risk</span><span class="lg-val">${pr}%</span></div>
      </div></div>`;
}
function updateBell(n){
  const dot=document.getElementById('bell-dot'); if(!dot) return;
  if(n>0){ dot.style.display='grid'; dot.textContent=n>99?'99+':n; } else dot.style.display='none';
}

V.project = async (id) => {
  setTitle('Project','delivery detail');
  const el = document.getElementById('view'); el.innerHTML = skeleton();
  const [p, arts, hos, mem, threads] = await Promise.all([
    api('GET','/projects/'+id),
    api('GET','/projects/'+id+'/artifacts').catch(()=>[]),
    api('GET','/projects/'+id+'/handoffs').catch(()=>[]),
    api('GET','/projects/'+id+'/memory').catch(()=>[]),
    api('GET','/projects/'+id+'/threads').catch(()=>[]),
  ]);
  const chatter = (threads.find(t=>t.thread_type==='status')||{}).messages||[];
  el.innerHTML='';
  el.append($(`<div class="back" onclick="go('projects')">← Projects</div>`));
  const acts = [];
  if(p.status==='planning'){ acts.push(`<button class="btn btn-primary btn-sm" onclick="runProject('${id}')">▶ Run it</button>`);
                             acts.push(`<button class="btn btn-sm" onclick="act('${id}','approve')">Approve only</button>`); }
  if(p.status==='active')   acts.push(`<button class="btn btn-primary btn-sm" onclick="runProject('${id}')">▶ Run</button>`);
  if(p.status==='executing')acts.push(`<span class="badge b-running">● agents working — auto-refreshing</span>`);
  if(p.status==='done')     acts.push(`<span class="badge b-done">✓ done — see Deliverables below</span>`);
  el.append($(`<div class="panel" style="margin-top:12px"><div class="row" style="align-items:flex-start">
      <div style="flex:1"><div style="font-size:17px;font-weight:700">${esc(p.goal)}</div>
        <div class="kv" style="margin-top:10px">${badge(p.status)} ${badge(p.health)}
          <span>due <b>${p.due_at?new Date(p.due_at).toLocaleString():'—'}</b></span>
          <span>critical path <b>${p.critical_path.length}</b> tasks</span></div></div>
      <div class="row">${acts.join('')}</div></div></div>`));

  // tasks
  const rows = p.tasks.map(t=>`<tr>
    <td class="muted">${esc(dept(t.department_id))}</td>
    <td>${t.is_critical?'<span class="star">★</span> ':''}${esc(t.goal)}</td>
    <td>${badge(t.status)}</td>
    <td class="muted">${t.est_effort_hours}h</td>
    <td class="muted">${t.slack_h}h</td>
    <td class="muted">${t.depends_on.length}</td></tr>`).join('');
  el.append($(`<div class="panel"><h2>Tasks (${p.tasks.length})</h2>
    <table style="margin-top:14px"><thead><tr><th>Dept</th><th>Task</th><th>Status</th><th>Effort</th><th>Slack</th><th>Deps</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`));

  // team chat — the agents talking through the work, task by task
  el.append($(`<div class="panel"><h2>Team chat (${chatter.length})</h2><div style="margin-top:14px">
    ${chatter.length?chatter.map(m=>{
        const i=m.content.indexOf(':'); const who=i>0?m.content.slice(0,i):'Agent'; const txt=i>0?m.content.slice(i+1).trim():m.content;
        return `<div class="chatmsg"><div class="avatar">${esc(who.trim()[0]||'A')}</div>
          <div class="chat-col"><div class="chat-meta"><b>${esc(who)}</b></div><div class="chatbody">${esc(txt)}</div></div></div>`;
      }).join('')
      :empty('The team talks here as they work — execute the project to watch them.')}</div></div>`));

  // artifacts
  el.append($(`<div class="panel"><h2>Deliverables (${arts.length})</h2><div style="margin-top:14px">${arts.length?arts.map(a=>`
    <div class="art-card"><div class="ah"><span class="muted">${esc(dept(a.department_id))}</span> · ${esc(a.task_goal)}
      ${a.blocked?badge('blocked'):a.needs_human?badge('human'):badge(a.status)}
      <span class="spacer"></span><span class="faint">v${a.version}</span></div>
      ${a.block_reason?`<div class="faint" style="color:var(--red);margin-top:6px">⛔ ${esc(a.block_reason)}</div>`:''}
      <pre class="art">${esc(a.content)||'<span class="faint">(empty)</span>'}</pre></div>`).join(''):empty('No deliverables yet — execute the project.')}</div></div>`));

  // handoffs
  el.append($(`<div class="panel"><h2>Cross-department handoffs (${hos.length})</h2><div style="margin-top:14px">${hos.length?hos.map(h=>`
    <div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)">
      <span class="badge">${esc(dept(h.from_department_id))} → ${esc(dept(h.to_department_id))}</span>
      <span class="muted">${esc(h.context)}</span><span class="spacer"></span><span class="faint">${h.evidence.length} evidence</span></div>`).join(''):empty('None.')}</div></div>`));

  // shared memory — what each agent wrote for the team to build on
  el.append($(`<div class="panel"><h2>Shared project memory (${mem.length})</h2>
    <p class="muted" style="margin:8px 0 14px">Each agent reads this before working, and writes to it after — so the team builds on itself instead of starting blank.</p>
    ${mem.length?mem.map(m=>`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--border)">
        <span class="chip">${esc(dept(m.department_id))}</span><span class="muted">${esc(m.content)}</span></div>`).join(''):empty('Empty until the project executes.')}</div>`));

  // while agents are working, keep refreshing so the chat + deliverables stream in live
  clearTimeout(_ptimer);
  if(p.status==='executing' && location.hash.indexOf('/project/'+id) >= 0)
    _ptimer=setTimeout(()=>V.project(id), 6000);
};

// ---------- actions ----------
async function directive(){
  const goal=(document.getElementById('goal').value||'').trim(); const m=document.getElementById('dmsg');
  if(!goal){ m.textContent='Enter a goal first.'; return; }
  m.textContent='Planning…';
  try{ const p=await api('POST','/projects',{goal});
    toast(`Plan drafted — ${p.tasks.length} tasks. Click ▶ Run it.`,'ok');
    location.hash='#/project/'+p.id;   // land on the project so Run is one click away
  }catch(e){ m.textContent='Error '+(e.status||'')+': '+(e.detail||''); }
}
let _ptimer=null;
async function runProject(id){   // one click: approve (if needed) + execute + watch live
  try{
    const p=await api('GET','/projects/'+id);
    if(p.status==='planning') await api('POST','/projects/'+id+'/approve');
    await api('POST','/projects/'+id+'/execute');
    toast('Running — agents are working, watch the Team chat','ok');
    V.project(id);
  }catch(e){ toast('Error '+(e.status||'')+': '+(e.detail||''),'err'); }
}
async function act(id, what){
  try{
    await api('POST',`/projects/${id}/${what}`);
    toast(what==='execute'?'Agents are working — watch the Team chat fill in':(what+'d'),'ok');
    V.project(id);   // re-renders; while status is "executing" it self-refreshes
  }catch(e){ toast('Error '+(e.status||'')+': '+(e.detail||''),'err'); }
}
async function decide(id, decision){
  const reason=(document.getElementById('r_'+id)||{}).value||null;
  try{ await api('POST',`/approvals/${id}/decide`,{decision,reason}); toast(decision==='approve'?'Approved':'Rejected','ok'); render(); }
  catch(e){ toast('Error: '+(e.detail||e.status),'err'); }
}
async function createLead(){
  const g=id=>document.getElementById(id).value;
  const attrs={}; [['budget','l-bud'],['authority','l-auth'],['need','l-need'],['timeline','l-time']].forEach(([k,i])=>{if(g(i))attrs[k]=g(i)});
  try{ const lead=await api('POST','/leads',{company:g('l-co'),industry:g('l-ind')||null,size_employees:g('l-size')?+g('l-size'):null,attributes:attrs});
    await api('POST',`/leads/${lead.id}/qualify`); toast('Lead qualified','ok'); V.leads();
  }catch(e){ toast('Error: '+(e.detail||e.status),'err'); }
}
async function ctl(path,msg){ try{ await api('POST',path); toast(msg,'ok'); V.controls(); }catch(e){ toast('Error: '+(e.detail||e.status),'err'); } }
async function genSecret(){ try{ const r=await api('POST','/integrations/leadforge/secret'); const el=document.getElementById('secret'); el.style.display='block'; el.textContent='X-LeadForge-Secret: '+r.secret+'\n\n'+r.note; toast('Secret generated','ok'); }catch(e){ toast('Error: '+(e.detail||e.status),'err'); } }

// ---------- router / boot ----------
function setTitle(t,s){ document.getElementById('pg-title').innerHTML=t; document.getElementById('pg-sub').textContent=s||''; }
let _rq=Promise.resolve();
function render(){ _rq=_rq.then(_render).catch(()=>{}); return _rq; }   // serialize: no overlapping renders
async function _render(){
  const hash=location.hash.replace('#/','')||'dashboard';
  const [k,arg]=hash.split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===k));
  try{ if(k==='project') await V.project(arg); else await (V[k]||V.dashboard)(); }
  catch(e){ if(e.status!==401) document.getElementById('view').innerHTML=`<div class="panel">${empty('Error '+(e.status||'')+': '+esc(e.detail||'request failed'))}</div>`; }
}
async function connect(){
  const err=document.getElementById('gate-err'); const btn=document.getElementById('gate-btn');
  const email=document.getElementById('gate-email').value.trim();
  const pw=document.getElementById('gate-pw').value;
  if(!email||!pw){ err.textContent='Enter your email and password.'; return; }
  err.textContent='Signing in…'; btn.disabled=true;
  // the console fetches its own token — no JWT handling by the user
  let r; try{ r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({email,password:pw})}); }
  catch(_){ err.textContent='Cannot reach the server.'; btn.disabled=false; return; }
  if(!r.ok){ err.textContent = r.status===401 ? 'Wrong email or password.' : 'Sign-in failed ('+r.status+').'; btn.disabled=false; return; }
  S.tok=cleanTok((await r.json()).access_token); localStorage.setItem('cos_tok',S.tok);
  S.email=email; localStorage.setItem('cos_email',email);
  document.getElementById('gate-pw').value='';
  try{ await boot(); err.textContent=''; }
  catch(e){ err.textContent='Signed in, but loading failed ('+(e.status||'')+').'; localStorage.removeItem('cos_tok'); S.tok=''; }
  finally{ btn.disabled=false; }
}
function logout(){ localStorage.removeItem('cos_tok'); S.tok=''; document.getElementById('app').style.display='none'; document.getElementById('gate').style.display='grid'; }
function paintWho(){
  const email = S.email || 'you@company.com';
  const name = (email.split('@')[0]||'?').replace(/[._-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  document.getElementById('who-av').textContent = (name.trim()[0]||'?').toUpperCase();
  document.getElementById('who-name').textContent = name;
  document.getElementById('who-email').textContent = email;
}
async function boot(){
  const depts = await api('GET','/departments');    // validates token + caches names
  S.depts={}; depts.forEach(d=>S.depts[d.id]=d.name);
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='grid';
  document.getElementById('conn').classList.add('ok'); document.getElementById('conn-txt').textContent='connected';
  paintWho();
  drawNav(); if(location.hash) render(); else location.hash='#/dashboard';  // hash change fires render once
}
window.addEventListener('hashchange', render);
window.addEventListener('load', ()=>{
  ['gate-email','gate-pw'].forEach(id=>document.getElementById(id)
    .addEventListener('keydown', e=>{ if(e.key==='Enter') connect(); }));   // Enter submits
  document.getElementById('topsearch')?.addEventListener('keydown', e=>{ if(e.key==='Enter') searchGo(); });
  if(S.tok){ boot().catch(()=>logout()); }   // stay signed in across reloads
});
</script>
